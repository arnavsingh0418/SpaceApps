<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>SpaceApps — Mars terrain</title>
    <link rel="icon" href="data:," />
    <style>
      * { box-sizing: border-box; }
      html, body { margin: 0; width: 100%; height: 100%; overflow: hidden; }
      body { background: #e0a982; color: #fff4e7; font: 14px/1.5 system-ui, sans-serif; }
      canvas { display: block; width: 100%; height: 100%; }
      header { position: absolute; top: 24px; left: 28px; pointer-events: none; text-shadow: 0 2px 6px #542719; }
      h1 { margin: 0; font-size: clamp(24px, 5vw, 38px); letter-spacing: -.04em; }
      p { margin: 2px 0 0; }
      #error { position: absolute; inset: auto 20px 20px; padding: 16px; background: #3a211d; }
    </style>
  </head>
  <body>
    <canvas id="world" aria-label="Mars terrain with a flat landing area and scattered rocks"></canvas>
    <header><h1>SpaceApps</h1><p>Mars terrain</p></header>
    <p id="error" role="alert" hidden></p>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
