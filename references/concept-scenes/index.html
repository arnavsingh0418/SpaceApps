<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Outpost Concept Scenes</title>
<script type="importmap">
{ "imports": { "three": "https://cdn.jsdelivr.net/npm/three@0.186.1/build/three.module.js" } }
</script>
<style>
  html, body { margin: 0; height: 100%; overflow: hidden; background: #1a0f0a; font-family: "Trebuchet MS", system-ui, sans-serif; }
  canvas { display: block; }
  #ui { position: fixed; inset: 0; pointer-events: none; color: #fff; }
  .panel { position: absolute; background: rgba(20,14,12,.82); border: 3px solid #2b1d17; border-radius: 14px; padding: 12px 14px; box-shadow: 0 4px 0 rgba(0,0,0,.35); }
  .stats { top: 16px; left: 16px; width: 250px; }
  .sol { font-size: 22px; font-weight: 900; letter-spacing: 1px; margin-bottom: 8px; }
  .bar { display: flex; align-items: center; gap: 8px; margin: 6px 0; font-weight: 800; font-size: 14px; }
  .bar .ico { width: 26px; text-align: center; font-size: 18px; }
  .bar .lbl { width: 62px; }
  .bar .track { flex: 1; height: 14px; background: #3a2a22; border-radius: 7px; overflow: hidden; border: 2px solid #120b08; }
  .bar .fill { height: 100%; border-radius: 5px; }
  .goal { top: 16px; right: 16px; width: 270px; }
  .goal h4 { margin: 0 0 6px; font-size: 13px; color: #fbbf24; letter-spacing: 1px; }
  .goal div { font-size: 14px; font-weight: 700; margin: 4px 0; }
  .tag { position: absolute; transform: translate(-50%, -100%); font-weight: 900; font-size: 13px; padding: 2px 8px; border-radius: 8px; background: rgba(0,0,0,.6); white-space: nowrap; }
  .prompt { position: absolute; transform: translate(-50%, -100%); background: #fff; color: #1a0f0a; font-weight: 900; padding: 6px 10px; border-radius: 10px; font-size: 14px; border: 3px solid #1a0f0a; white-space: nowrap; }
  .prompt b { background: #1a0f0a; color: #fff; padding: 1px 6px; border-radius: 5px; margin-right: 6px; }
  .center { left: 50%; transform: translateX(-50%); }
  .banner { top: 16px; text-align: center; font-weight: 900; font-size: 22px; padding: 10px 22px; }
  .card { width: 430px; }
  .card h3 { margin: 0 0 4px; font-size: 20px; }
  .card p { margin: 4px 0 10px; font-size: 14px; line-height: 1.35; color: #f3e6dc; }
  .choice { display: flex; justify-content: space-between; align-items: center; background: #2f211a; border: 3px solid #4a3328; border-radius: 10px; padding: 8px 10px; margin: 6px 0; font-weight: 800; font-size: 15px; }
  .choice small { font-weight: 700; font-size: 12px; color: #fca5a5; }
  .choice small.good { color: #86efac; }
  .src { font-size: 11px; color: #a8a29e; margin-top: 8px; }
  .chat { left: 16px; bottom: 16px; width: 330px; font-size: 13px; font-weight: 700; }
  .chat div { margin: 3px 0; }
  .slider { margin: 8px 0; font-weight: 800; font-size: 14px; }
  .slider .row { display: flex; justify-content: space-between; margin-bottom: 3px; }
  .pips { display: flex; gap: 4px; }
  .pip { flex: 1; height: 16px; border-radius: 4px; background: #3a2a22; border: 2px solid #120b08; }
  .pip.on { background: #facc15; }
  .hot { border-color: #ef4444 !important; }
  .fact { background: #1e3a5f; border-color: #0f2340; width: 300px; font-size: 13px; font-weight: 700; line-height: 1.35; }
  .fact b { color: #7dd3fc; }
  .hotbar { bottom: 16px; display: flex; gap: 8px; padding: 8px; }
  .slot { width: 54px; height: 54px; border-radius: 10px; background: #2f211a; border: 3px solid #4a3328; display: grid; place-items: center; font-size: 24px; position: relative; }
  .slot span { position: absolute; right: 4px; bottom: 1px; font-size: 12px; font-weight: 900; }
  .slot.sel { border-color: #facc15; }
</style>
</head>
<body>
<div id="ui"></div>
<script type="module">
import * as THREE from 'three';

const scene = Number(new URLSearchParams(location.search).get('scene') || 1);
const ui = document.getElementById('ui');
const renderer = new THREE.WebGLRenderer({ antialias: true, preserveDrawingBuffer: true });
renderer.setPixelRatio(Math.min(2, devicePixelRatio));
renderer.setSize(innerWidth, innerHeight);
renderer.shadowMap.enabled = true;
renderer.shadowMap.type = THREE.PCFSoftShadowMap;
document.body.prepend(renderer.domElement);

const S = new THREE.Scene();
const cam = new THREE.PerspectiveCamera(42, innerWidth / innerHeight, 0.1, 400);
const mat = (c, o = {}) => new THREE.MeshStandardMaterial({ color: c, flatShading: true, roughness: 0.9, ...o });
const add = (m, x = 0, y = 0, z = 0) => { m.position.set(x, y, z); m.castShadow = m.receiveShadow = true; S.add(m); return m; };

// --- sky + light (per scene mood) ---
const mood = {
  1: { sky: 0xe0a982, fog: 0xd99a72, sun: 0xffe2c4, amb: 0.75 },
  2: { sky: 0xd99a72, fog: 0xc98a64, sun: 0xffd6b0, amb: 0.7 },
  3: { sky: 0x8a5a4a, fog: 0x7a4a3c, sun: 0xffb08a, amb: 0.55 },
  4: { sky: 0x9c5a3a, fog: 0xb07050, sun: 0xffc090, amb: 0.6 },
}[scene];
S.background = new THREE.Color(mood.sky);
S.fog = new THREE.Fog(mood.fog, scene === 4 ? 30 : 45, scene === 4 ? 90 : 120);
S.add(new THREE.HemisphereLight(0xfff0e0, 0x7a3a20, mood.amb));
const sun = new THREE.DirectionalLight(mood.sun, 1.6);
sun.position.set(-20, 30, 15); sun.castShadow = true;
sun.shadow.mapSize.set(2048, 2048);
Object.assign(sun.shadow.camera, { left: -40, right: 40, top: 40, bottom: -40 });
S.add(sun);

// --- terrain: seeded noise, flat shaded ---
let seed = 7; const rnd = () => (seed = (seed * 16807) % 2147483647) / 2147483647;
const ground = new THREE.PlaneGeometry(200, 200, 90, 90); ground.rotateX(-Math.PI / 2);
const gp = ground.attributes.position;
for (let i = 0; i < gp.count; i++) {
  const x = gp.getX(i), z = gp.getZ(i), r = Math.hypot(x, z);
  let h = Math.sin(x * 0.12) * Math.cos(z * 0.1) * 0.8 + (rnd() - 0.5) * 0.35;
  h += Math.min(3, Math.max(0, r - 34) * 0.08);                 // crater walls rising around the play area
  if (r > 30 && r < 42) h += Math.sin((r - 30) / 12 * Math.PI) * 1.6;  // rim
  gp.setY(i, h);
}
ground.computeVertexNormals();
add(new THREE.Mesh(ground, mat(0xc4562a)));
const groundY = (x, z) => 0;
for (let i = 0; i < 70; i++) {
  const a = rnd() * Math.PI * 2, r = 6 + rnd() * 40;
  const s = 0.2 + rnd() * (r > 25 ? 1.0 : 0.5);
  const rock = add(new THREE.Mesh(new THREE.DodecahedronGeometry(s, 0), mat(rnd() > .5 ? 0x8a3a1c : 0x6e2e18)), Math.cos(a) * r, s * 0.4, Math.sin(a) * r);
  rock.rotation.set(rnd() * 3, rnd() * 3, rnd() * 3);
}

// --- builders ---
const crewList = [];
function astronaut(color) {
  const g = new THREE.Group();
  const suit = mat(color), dark = mat(0x3a3a44), white = mat(0xe8e4dc);
  const body = new THREE.Mesh(new THREE.CapsuleGeometry(0.42, 0.55, 4, 10), suit); body.position.y = 1.0; g.add(body);
  const head = new THREE.Mesh(new THREE.SphereGeometry(0.42, 16, 12), mat(0xf5f5f4)); head.position.y = 1.78; g.add(head);
  const visor = new THREE.Mesh(new THREE.SphereGeometry(0.44, 16, 12, Math.PI / 2 - 0.95, 1.9, 0.75, 1.25), mat(0x67e8f9, { emissive: 0x0e7490, emissiveIntensity: 0.6, roughness: 0.2, flatShading: false }));
  visor.position.set(0, 1.78, 0.02); g.add(visor);
  const pack = new THREE.Mesh(new THREE.BoxGeometry(0.62, 0.7, 0.32), white); pack.position.set(0, 1.12, -0.42); g.add(pack);
  for (const s of [-1, 1]) {
    const leg = new THREE.Mesh(new THREE.CapsuleGeometry(0.15, 0.35, 3, 8), suit); leg.position.set(s * 0.18, 0.35, 0); g.add(leg);
    const boot = new THREE.Mesh(new THREE.BoxGeometry(0.24, 0.16, 0.34), dark); boot.position.set(s * 0.18, 0.08, 0.04); g.add(boot);
    const arm = new THREE.Mesh(new THREE.CapsuleGeometry(0.12, 0.42, 3, 8), suit); arm.position.set(s * 0.52, 1.05, 0); arm.rotation.z = s * 0.15; arm.name = s < 0 ? 'armL' : 'armR'; g.add(arm);
  }
  g.traverse(o => { if (o.isMesh) o.castShadow = true; });
  g.scale.setScalar(1.35); crewList.push(g);
  S.add(g); return g;
}
function wreck(x, z) {
  const g = new THREE.Group();
  const hull = new THREE.Mesh(new THREE.CylinderGeometry(1.8, 2.1, 9, 8), mat(0xe8e4dc)); hull.rotation.z = Math.PI / 2; g.add(hull);
  const stripe = new THREE.Mesh(new THREE.CylinderGeometry(1.86, 1.86, 1.2, 8), mat(0xf97316)); stripe.rotation.z = Math.PI / 2; stripe.position.x = 1.5; g.add(stripe);
  const nose = new THREE.Mesh(new THREE.ConeGeometry(1.8, 3, 8), mat(0xe8e4dc)); nose.rotation.z = -Math.PI / 2; nose.position.x = 6; g.add(nose);
  for (const s of [-1, 1]) { const fin = new THREE.Mesh(new THREE.BoxGeometry(2.4, 0.2, 2.2), mat(0xf97316)); fin.position.set(-3.6, 0.4, s * 2.2); fin.rotation.x = s * 0.4; g.add(fin); }
  const win = new THREE.Mesh(new THREE.BoxGeometry(1.4, 0.8, 3.7), mat(0x334155, { roughness: 0.3 })); win.position.set(4.2, 0.6, 0); g.add(win);
  g.position.set(x, 1.1, z); g.rotation.set(0.15, 0.5, -0.12);
  g.traverse(o => { if (o.isMesh) o.castShadow = o.receiveShadow = true; });
  S.add(g); return g;
}
function smoke(x, y, z) {
  for (let i = 0; i < 9; i++) {
    const p = add(new THREE.Mesh(new THREE.SphereGeometry(0.6 + i * 0.2, 12, 10), mat(0xb8aca4, { transparent: true, opacity: 0.4 - i * 0.035, depthWrite: false })), x + Math.sin(i) * 0.6 + i * 0.4, y + i * 1.1, z);
    p.castShadow = false;
  }
}
function crate(x, z, c = 0x8b6a45, s = 0.8) { const b = add(new THREE.Mesh(new THREE.BoxGeometry(s, s, s), mat(c)), x, s / 2, z); b.rotation.y = rnd(); return b; }
function panel(x, z, rot = 0, dusty = 0) {
  const g = new THREE.Group();
  const post = new THREE.Mesh(new THREE.CylinderGeometry(0.06, 0.06, 1), mat(0x9ca3af)); post.position.y = 0.5; g.add(post);
  const p = new THREE.Mesh(new THREE.BoxGeometry(2.2, 0.08, 1.3), mat(dusty ? 0x8a5a44 : 0x1e3a8a, { roughness: dusty ? 1 : 0.35 })); p.position.y = 1.05; p.rotation.x = -0.5; g.add(p);
  g.position.set(x, 0, z); g.rotation.y = rot; g.traverse(o => { if (o.isMesh) o.castShadow = true; }); S.add(g); return g;
}
function dome(x, z, r, c = 0xe8e4dc) { return add(new THREE.Mesh(new THREE.SphereGeometry(r, 14, 8, 0, Math.PI * 2, 0, Math.PI / 2), mat(c)), x, 0, z); }
function greenhouse(x, z) {
  const g = new THREE.Group();
  const shell = new THREE.Mesh(new THREE.CylinderGeometry(1.6, 1.6, 5, 10, 1, false, 0, Math.PI), mat(0xbbf7d0, { transparent: true, opacity: 0.45, roughness: 0.2 }));
  shell.rotation.z = Math.PI / 2; shell.rotation.y = Math.PI / 2; g.add(shell);
  for (let i = -2; i <= 2; i++) for (const s of [-0.7, 0.7]) { const plant = new THREE.Mesh(new THREE.ConeGeometry(0.3, 0.7, 6), mat(0x22c55e)); plant.position.set(s, 0.35, i * 0.9); g.add(plant); }
  g.position.set(x, 0, z); S.add(g); return g;
}
function dish(x, z, broken = false) {
  const g = new THREE.Group();
  const mast = new THREE.Mesh(new THREE.CylinderGeometry(0.1, 0.14, 3), mat(0x9ca3af)); mast.position.y = 1.5; g.add(mast);
  const d = new THREE.Mesh(new THREE.SphereGeometry(1.3, 14, 8, 0, Math.PI * 2, 0, Math.PI / 3.2), mat(0xe5e7eb, { side: THREE.DoubleSide }));
  d.position.y = 3; d.rotation.x = broken ? 2.6 : -0.9; g.add(d);
  g.position.set(x, 0, z); g.traverse(o => { if (o.isMesh) o.castShadow = true; }); S.add(g); return g;
}
function glow(x, y, z, c = 0xfacc15) { const r = add(new THREE.Mesh(new THREE.TorusGeometry(0.7, 0.07, 6, 24), new THREE.MeshBasicMaterial({ color: c })), x, y, z); r.rotation.x = -Math.PI / 2; return r; }

// --- labels projected onto the HTML layer ---
const labels = [];
const label = (obj, html, cls = 'tag', dy = 2.5, color) => {
  const el = document.createElement('div'); el.className = cls; el.innerHTML = html; if (color) el.style.color = color; ui.appendChild(el);
  labels.push({ obj, el, dy });
};
const html = s => { const d = document.createElement('div'); d.innerHTML = s; while (d.firstChild) ui.appendChild(d.firstChild); };
const bar = (ico, lbl, pct, color, hot) => `<div class="bar"><span class="ico">${ico}</span><span class="lbl">${lbl}</span><div class="track ${hot ? 'hot' : ''}"><div class="fill" style="width:${pct}%;background:${color}"></div></div></div>`;
const stats = (sol, p, a, f, d) => `<div class="panel stats"><div class="sol">SOL ${sol} <span style="font-size:13px;color:#d6c4b8">· 1 sol = 24h 39m</span></div>
  ${bar('⚡', 'Power', p, '#facc15', p < 30)}${bar('💨', 'Air', a, '#38bdf8', a < 30)}${bar('🥔', 'Food', f, '#4ade80', f < 30)}${bar('☢️', 'Dose', d, '#f87171', d > 60)}</div>`;

const crew = [['ARNAV', 0xf97316], ['MAYA', 0x3b82f6], ['LEO', 0x22c55e], ['ZOE', 0xeab308]];
let player;

// ================= SCENES =================
if (scene === 1) {
  // Explore & gather around the crash site
  wreck(-6, -4); smoke(-8, 3, -5);
  const a = astronaut(crew[0][1]); a.position.set(1.5, 0, 3); a.rotation.y = -0.6; player = a;
  crate(1.9, 3.5, 0x9ca3af, 0.55).position.y = 1.15; a.getObjectByName('armL').rotation.x = -1.2; a.getObjectByName('armR').rotation.x = -1.2;
  const b = astronaut(crew[1][1]); b.position.set(7, 0, -1); b.rotation.y = -2.2;
  const c = astronaut(crew[2][1]); c.position.set(-1, 0, 8); c.rotation.y = 0.4;
  const d = astronaut(crew[3][1]); d.position.set(-11, 0, 4); d.rotation.y = 1.2;
  // pickups
  const p1 = panel(5.5, 5, 0.8); p1.rotation.z = 0.5; glow(5.5, 0.08, 5);
  const ice = add(new THREE.Mesh(new THREE.IcosahedronGeometry(0.6, 0), mat(0xbae6fd, { roughness: 0.2 })), 10, 0.5, 6); glow(10, 0.08, 6, 0x7dd3fc);
  const scrap = add(new THREE.Mesh(new THREE.BoxGeometry(1.2, 0.2, 0.8), mat(0x9ca3af)), -3, 0.15, 7); scrap.rotation.y = 0.7; glow(-3, 0.08, 7);
  crate(-2, -9); crate(-1, -10); crate(3, -7, 0x9ca3af);
  dish(-13, 1, true);
  label(a, crew[0][0] + ' (you)', 'tag', 2.6, '#fdba74'); label(b, crew[1][0], 'tag', 2.6, '#93c5fd'); label(c, crew[2][0], 'tag', 2.6, '#86efac'); label(d, crew[3][0], 'tag', 2.6, '#fde047');
  label(p1, '<b>E</b> Pick up Solar Panel', 'prompt', 2.2);
  label(ice, '❄️ Ice chunk → water + air', 'tag', 1.6, '#bae6fd');
  label(scrap, '🔩 Scrap metal', 'tag', 1.2);
  cam.position.set(7, 8.5, 20); cam.lookAt(-1, 1, -1);
  html(stats(1, 64, 78, 90, 8));
  html(`<div class="panel goal"><h4>CREW GOALS</h4><div>📡 Fix the radio <span style="color:#a8a29e">0/3 parts</span></div><div>🏠 Build a shelter</div><div>🌱 Start a greenhouse</div></div>`);
  html(`<div class="panel center hotbar">${['🔩<span>3</span>', '❄️<span>1</span>', '📦', '🔧', '🔦'].map((s, i) => `<div class="slot ${i === 2 ? 'sel' : ''}">${s}</div>`).join('')}</div>`);
  html(`<div class="panel chat"><div style="color:#93c5fd">MAYA: found ice by the crater wall!</div><div style="color:#86efac">LEO: radio needs an antenna + power</div><div style="color:#fde047">ZOE: anyone seen the battery?</div></div>`);
}

if (scene === 2) {
  // The outpost: split today's power — the core trade-off
  wreck(-14, -10);
  dome(-2, -3, 3.2); dome(2.8, -4.5, 2.2, 0xd6d3d1);
  greenhouse(7, 1);
  for (let i = 0; i < 4; i++) panel(-9 + i * 2.6, 4, 0, i === 3);
  dish(-7, -5);
  const a = astronaut(crew[0][1]); a.position.set(1, 0, 3); a.rotation.y = 2.6; player = a;
  const b = astronaut(crew[1][1]); b.position.set(7, 0, 4); b.rotation.y = 0;
  const c = astronaut(crew[2][1]); c.position.set(-6, 0, 7); c.rotation.y = 3;
  c.getObjectByName('armR').rotation.x = -1.4;
  label(a, crew[0][0] + ' (you)', 'tag', 2.6, '#fdba74'); label(b, crew[1][0] + ' 🌱', 'tag', 2.6, '#93c5fd'); label(c, crew[2][0] + ' 🧹 cleaning panel', 'tag', 2.6, '#86efac');
  cam.position.set(-3, 9, 21); cam.lookAt(-1, 1, -1);
  html(stats(6, 41, 66, 52, 22));
  const sl = (name, ico, on, note, cls = '') => `<div class="slider"><div class="row"><span>${ico} ${name}</span><span style="color:#d6c4b8;font-size:12px">${note}</span></div><div class="pips">${Array.from({ length: 6 }, (_, i) => `<div class="pip ${i < on ? 'on' : ''}"></div>`).join('')}</div></div>`;
  html(`<div class="panel card" style="right:16px;top:16px"><h3>⚡ Split today's power</h3>
    <p>Dust covered one panel, so you only have <b style="color:#facc15">10 power blocks</b> today. Every block you give one thing is taken from another.</p>
    ${sl('Air machine', '💨', 4, 'needs 3 to stay safe')}
    ${sl('Greenhouse lights', '🌱', 2, 'less light = less food')}
    ${sl('Radio', '📡', 3, 'message to Earth: 12 min each way')}
    ${sl('Heaters', '🔥', 1, 'nights hit −80 °C')}
    <div class="choice" style="border-color:#facc15"><span>✅ Lock it in</span><small>10 / 10 used</small></div></div>`);
  html(`<div class="panel fact" style="left:16px;bottom:16px"><b>Real astronaut fact:</b> dust on solar panels slowly drains rover power on Mars. Wind gusts sometimes blow it off. That's why Leo is cleaning one!</div>`);
}

if (scene === 3) {
  // Solar flare alert (real DONKI event) — shelter vs keep working
  dome(-2, -3, 3.2); greenhouse(7, 1); dish(-7, -5);
  // shelter: dug-in dome ringed with water tanks
  const sh = dome(-12, 6, 2.6, 0x78716c);
  for (let i = 0; i < 10; i++) { const a = i / 10 * Math.PI * 2; add(new THREE.Mesh(new THREE.CylinderGeometry(0.45, 0.45, 1.3, 8), mat(0x0ea5e9)), -12 + Math.cos(a) * 3.3, 0.65, 6 + Math.sin(a) * 3.3); }
  const a = astronaut(crew[0][1]); a.position.set(-5, 0, 6); a.rotation.y = -1.6; player = a;
  const b = astronaut(crew[1][1]); b.position.set(-8, 0, 3); b.rotation.y = -1.9;
  const c = astronaut(crew[2][1]); c.position.set(5, 0, 5); c.rotation.y = 1.4;
  for (const g of [a, b]) { g.getObjectByName('armL').rotation.x = 0.8; g.getObjectByName('armR').rotation.x = -0.8; }
  label(a, crew[0][0] + ' (you)', 'tag', 2.6, '#fdba74'); label(b, crew[1][0], 'tag', 2.6, '#93c5fd'); label(c, crew[2][0] + ' ⚠️ still outside', 'tag', 2.6, '#86efac');
  label(sh, '🛡️ STORM SHELTER<br><span style="font-weight:700;font-size:11px">water walls block radiation</span>', 'tag', 3.6, '#7dd3fc');
  // red-tinted sun flare glow
  const flare = new THREE.Mesh(new THREE.SphereGeometry(4, 16, 12), new THREE.MeshBasicMaterial({ color: 0xffd27a })); flare.position.set(30, 40, -90); S.add(flare);
  cam.position.set(3, 8.5, 21); cam.lookAt(-3, 1.5, -1);
  html(stats(9, 58, 61, 47, 47));
  html(`<div class="panel center banner" style="background:#7f1d1d;border-color:#450a0a">☀️ SOLAR FLARE! Radiation arrives soon</div>`);
  html(`<div class="panel card" style="right:16px;top:80px"><h3>What does the crew do?</h3>
    <p>The Sun shot out a burst of energy. Mars has no magnetic shield like Earth, so the tiny particles reach the surface. Your <b>dose</b> is how much radiation your body has soaked up.</p>
    <div class="choice"><span>🛡️ Everyone into the shelter</span><small>−1 day greenhouse care · 🥔 −10</small></div>
    <div class="choice"><span>🔧 Finish the radio first</span><small>☢️ dose +25</small></div>
    <div class="choice"><span>🧱 Stack ice blocks on the hab</span><small class="good">safer next time</small> <small>⚡ −2 blocks</small></div>
    <div class="src">📊 Real flare: X8.7 on 14 May 2024, from NASA DONKI (space weather database)</div></div>`);
  html(`<div class="panel chat"><div style="color:#fbbf24">📡 MISSION CONTROL (sent 12 min ago): "Flare spotted, take cover!"</div><div style="color:#d6c4b8;font-size:12px">Radio messages take 3 to 22 min to reach Mars, so Earth can't warn you instantly.</div></div>`);
}

if (scene === 4) {
  // Dust storm + dust devil: protect your stuff
  wreck(-16, -10); dome(-3, -4, 3.2); dish(-9, -6);
  for (let i = 0; i < 3; i++) panel(-10 + i * 2.6, 3, 0, true);
  // dust devil: stacked translucent rings, debris orbiting
  const devil = new THREE.Group();
  for (let i = 0; i < 11; i++) {
    const r = new THREE.Mesh(new THREE.CylinderGeometry(0.5 + i * 0.17, 0.4 + i * 0.17, 0.8, 10, 1, true), mat(0xc98a5e, { transparent: true, opacity: 0.32, side: THREE.DoubleSide, depthWrite: false }));
    r.position.set(Math.sin(i * 0.5) * 0.4, i * 0.75, 0); r.rotation.y = i; devil.add(r);
  }
  devil.position.set(12, 0, -2); S.add(devil);
  for (let i = 0; i < 6; i++) { const a = i; const cr = crate(12 + Math.cos(a) * 1.8, -2 + Math.sin(a) * 1.8, i % 2 ? 0x9ca3af : 0x8b6a45, 0.45); cr.position.y = 1.2 + i * 1.0; cr.rotation.set(i, i * 2, 0); }
  // dust wall
  for (let i = 0; i < 12; i++) { const w = add(new THREE.Mesh(new THREE.SphereGeometry(9 + rnd() * 5, 10, 8), mat(0x7a3a20, { transparent: true, opacity: 0.9 })), -55 + i * 10, 4, -30 - rnd() * 5); w.castShadow = false; }
  const a = astronaut(crew[0][1]); a.position.set(1, 0, 4); a.rotation.y = -2.3; player = a;
  crate(1.2, 3.3, 0x8b6a45, 0.7).position.y = 1.15; a.getObjectByName('armL').rotation.x = -1.2; a.getObjectByName('armR').rotation.x = -1.2;
  const d = astronaut(crew[3][1]); d.position.set(-2, 0, 2.5); d.rotation.y = -2.6;
  const b = astronaut(crew[1][1]); b.position.set(-8.5, 0, 5); b.rotation.y = 3; b.getObjectByName('armR').rotation.x = -1.6;
  label(a, crew[0][0] + ' (you)', 'tag', 2.6, '#fdba74'); label(d, crew[3][0], 'tag', 2.6, '#fde047'); label(b, crew[1][0] + ' covering panels', 'tag', 2.6, '#93c5fd');
  label(devil, '🌪️ DUST DEVIL<br><span style="font-weight:700;font-size:11px">grabs anything left outside</span>', 'tag', 6.5, '#fed7aa');
  const door = add(new THREE.Mesh(new THREE.BoxGeometry(1.4, 1.8, 0.4), mat(0x1f2937)), -1.2, 0.9, -0.85); door.rotation.y = 0.3;
  label(door, '<b>E</b> Store in hab (2 slots left)', 'prompt', 2.4);
  cam.position.set(10, 8, 21); cam.lookAt(1, 2.5, -1);
  html(stats(14, 23, 55, 38, 51));
  html(`<div class="panel center banner" style="background:#7c2d12;border-color:#431407">🌫️ DUST STORM in 0:45 · Secure your materials!</div>`);
  html(`<div class="panel goal" style="top:80px"><h4>STORM CHECKLIST</h4><div>✅ Radio parts inside</div><div>⬜ Cover the solar panels <span style="color:#a8a29e">(1/3)</span></div><div>⬜ Food crates inside <span style="color:#a8a29e">(2/4)</span></div><div style="color:#fca5a5;font-size:12px">Anything left out may get scratched or carried off</div></div>`);
  html(`<div class="panel fact" style="left:16px;bottom:16px"><b>Real or game?</b> Mars air is over 100× thinner than Earth's, so storms can't throw big things around. The real danger is <b>dust</b>: it blocks sunlight for weeks. A 2018 storm ended the Opportunity rover's mission.</div>`);
}

for (const g of crewList) { const base = Math.atan2(cam.position.x - g.position.x, cam.position.z - g.position.z); g.rotation.y = base + Math.max(-1.1, Math.min(1.1, g.rotation.y * 0.35)); }
// render + place labels
function frame() {
  renderer.render(S, cam);
  for (const { obj, el, dy } of labels) {
    const v = new THREE.Vector3(); obj.getWorldPosition(v); v.y += dy; v.project(cam);
    el.style.left = (v.x * 0.5 + 0.5) * innerWidth + 'px'; el.style.top = (-v.y * 0.5 + 0.5) * innerHeight + 'px';
  }
}
frame(); requestAnimationFrame(frame);
addEventListener('resize', () => { renderer.setSize(innerWidth, innerHeight); cam.aspect = innerWidth / innerHeight; cam.updateProjectionMatrix(); frame(); });
window.__ready = true;
</script>
